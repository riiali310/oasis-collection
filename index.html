<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oasis — Vinyyli­kokoelma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #0c0c0d;
  --bg2:   #141416;
  --bg3:   #1c1c1f;
  --line:  rgba(255,255,255,.08);
  --text:  #e8e6e0;
  --muted: #7a7870;
  --accent:#c8a96e;
  --acc2:  #4a9eff;
  --green: #3dba7e;
  --red:   #e05252;
  --amber: #e8a838;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;}
body{min-height:100vh;}

header{border-bottom:1px solid var(--line);padding:2rem 2rem 1.5rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;letter-spacing:.04em;color:var(--accent);line-height:1;}
.logo span{color:var(--muted);font-size:1rem;font-family:'DM Mono',monospace;display:block;letter-spacing:.12em;margin-bottom:.3rem;}
.header-meta{text-align:right;font-size:.8rem;color:var(--muted);font-family:'DM Mono',monospace;}
.header-meta strong{color:var(--accent);font-size:1.6rem;font-family:'Bebas Neue',sans-serif;display:block;letter-spacing:.05em;}

.stats-bar{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;}
.stat-item{flex:1;min-width:100px;padding:1rem 1.5rem;border-right:1px solid var(--line);font-family:'DM Mono',monospace;}
.stat-item:last-child{border-right:none;}
.stat-item .n{font-size:1.6rem;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;}
.stat-item .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.n.g{color:var(--green)}.n.r{color:var(--red)}.n.a{color:var(--accent)}

.toolbar{padding:1rem 2rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);}
.search-wrap{position:relative;flex:1;min-width:180px;}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.5rem .75rem .5rem 2rem;border-radius:4px;font-family:'DM Mono',monospace;font-size:.8rem;outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap::before{content:'⌕';position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none;}
select{background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.5rem .75rem;border-radius:4px;font-family:'DM Mono',monospace;font-size:.8rem;outline:none;cursor:pointer;}
.tabs{display:flex;gap:.25rem;flex-wrap:wrap;}
.tab{padding:.35rem .9rem;font-size:.75rem;font-family:'DM Mono',monospace;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--muted);background:transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}

.grid-wrap{padding:1.5rem 2rem;}
.section-head{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.4rem;margin:1.5rem 0 .75rem;display:flex;align-items:center;gap:.75rem;}
.chip{font-family:'DM Mono',monospace;font-size:.65rem;padding:1px 7px;border-radius:2px;}
.chip-g{background:rgba(61,186,126,.15);color:var(--green);}
.chip-r{background:rgba(224,82,82,.15);color:var(--red);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:1px;background:var(--line);}

.card{background:var(--bg2);position:relative;cursor:pointer;display:block;text-decoration:none;color:inherit;}
.card.missing{opacity:.6;}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:saturate(.9);}
.card.missing img{filter:saturate(0) brightness(.65);}
.card-placeholder{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg3);}
.card-placeholder svg{opacity:.25;}
.card-info{padding:.6rem .7rem .7rem;}
.card-title{font-size:.78rem;font-weight:500;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2rem;}
.card.missing .card-title{color:var(--muted);}
.card-sub{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fmt-tag{position:absolute;top:6px;right:6px;font-family:'DM Mono',monospace;font-size:.6rem;font-weight:500;padding:1px 5px;border-radius:2px;letter-spacing:.04em;}
.ft-lp {background:rgba(61,186,126,.2);color:var(--green);}
.ft-7  {background:rgba(74,158,255,.2);color:var(--acc2);}
.ft-12 {background:rgba(200,169,110,.2);color:var(--accent);}
.ft-oth{background:rgba(122,120,112,.2);color:var(--muted);}
.sp-tag{position:absolute;top:6px;left:6px;font-family:'DM Mono',monospace;font-size:.58rem;font-weight:500;padding:1px 5px;border-radius:2px;background:rgba(232,168,56,.2);color:var(--amber);}
.miss-tag{position:absolute;top:6px;left:6px;font-family:'DM Mono',monospace;font-size:.58rem;font-weight:500;padding:1px 5px;border-radius:2px;background:rgba(224,82,82,.2);color:var(--red);}
.status-bar{position:absolute;bottom:0;left:0;right:0;height:2px;}
.card.owned  .status-bar{background:var(--green);}
.card.missing .status-bar{background:var(--red);}

#admin-bar{display:none;background:var(--bg3);border-bottom:1px solid var(--accent);padding:.75rem 2rem;align-items:center;gap:1rem;flex-wrap:wrap;}
#admin-bar.visible{display:flex;}
#admin-bar span{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--accent);}
.btn{font-family:'DM Mono',monospace;font-size:.75rem;padding:.4rem .9rem;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:3px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--accent);color:var(--bg);}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:#fff;}

#login-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:100;}
#login-modal.visible{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--line);padding:2rem;width:340px;border-radius:4px;}
.modal-box h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.06em;color:var(--accent);margin-bottom:1rem;}
.modal-box label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);display:block;margin-bottom:.3rem;}
.modal-box input[type=password]{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.5rem .75rem;border-radius:3px;font-family:'DM Mono',monospace;font-size:.85rem;outline:none;margin-bottom:1rem;}
.modal-box input:focus{border-color:var(--accent);}
.modal-row{display:flex;gap:.5rem;justify-content:flex-end;}
.modal-err{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--red);margin-bottom:.5rem;display:none;}

footer{border-top:1px solid var(--line);padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;}
footer p{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);}
footer a{color:var(--accent);text-decoration:none;}
#login-btn{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);background:none;border:none;cursor:pointer;}
#login-btn:hover{color:var(--accent);}

@media(max-width:600px){
  header,.toolbar,.grid-wrap,footer{padding-left:1rem;padding-right:1rem;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span>VINYL COLLECTION</span>Oasis</div>
  <div class="header-meta"><strong id="total-count">—</strong>levyä kokoelmassa</div>
</header>

<div class="stats-bar" id="stats-bar"></div>

<div id="admin-bar">
  <span>⚡ Muokkaustila päällä</span>
  <button class="btn" onclick="syncDiscogs()">↻ Synkronoi Discogs</button>
  <button class="btn danger" onclick="adminLogout()">Kirjaudu ulos</button>
</div>

<div class="toolbar">
  <div class="search-wrap"><input id="search" type="text" placeholder="Hae levyä..." autocomplete="off"></div>
  <select id="sort">
    <option value="year">Vuosi</option>
    <option value="title">Nimi A–Z</option>
    <option value="status">Omistaa ensin</option>
  </select>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">Kaikki</button>
    <button class="tab" data-tab="owned">Omistaa</button>
    <button class="tab" data-tab="missing">Puuttuu</button>
    <button class="tab" data-tab="albums">Albumit</button>
    <button class="tab" data-tab="singles">Sinkut</button>
    <button class="tab" data-tab="special">Erikoiset ★</button>
    <button class="tab" data-tab="era">Aikakausi</button>
  </div>
</div>

<main class="grid-wrap" id="main"></main>

<footer>
  <p>Päivitetty: <span id="updated">—</span> &nbsp;·&nbsp; <a href="https://www.discogs.com/user/freeal/collection" target="_blank">Discogs-profiili ↗</a></p>
  <button id="login-btn" onclick="showLogin()">⚙</button>
</footer>

<div id="login-modal">
  <div class="modal-box">
    <h2>Kirjaudu sisään</h2>
    <label>Salasana</label>
    <input type="password" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <p class="modal-err" id="login-err">Väärä salasana</p>
    <div class="modal-row">
      <button class="btn" style="border-color:var(--muted);color:var(--muted)" onclick="hideLogin()">Peruuta</button>
      <button class="btn" onclick="doLogin()">Kirjaudu</button>
    </div>
  </div>
</div>

let DATA = null;
let currentTab = 'all';

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loadData() {
  try {
    const r = await fetch('data/collection.json?v='+Date.now());
    DATA = await r.json();
    document.getElementById('total-count').textContent = DATA.meta.total;
    document.getElementById('updated').textContent = DATA.meta.updated;
    renderStats();
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = '<p style="padding:2rem;color:var(--muted);font-family:monospace">Virhe ladattaessa dataa.</p>';
  }
}

function getOwned() { return DATA ? DATA.owned : []; }

function buildAll() {
  const owned = getOwned();
  const ownedMids = new Set(owned.map(o => o.master_id));
  const missing = DISCOGRAPHY
    .filter(d => !ownedMids.has(d.mid))
    .map(d => ({
      ...d,
      id: d.mid,
      master_id: d.mid,
      format: d.fmt,
      status: 'missing',
      thumb: MASTER_THUMBS[d.mid] || ''
    }));
  return [
    ...owned.map(o => ({...o, status:'owned'})),
    ...missing
  ];
}

function fmtClass(fmt) {
  if (!fmt) return 'oth';
  if (fmt.includes('LP')||fmt.includes('xLP')) return 'lp';
  if (fmt.startsWith('7')) return 's7';
  if (fmt.startsWith('12')) return 's12';
  return 'oth';
}
const FTC = {lp:'ft-lp',s7:'ft-7',s12:'ft-12',oth:'ft-oth'};

function era(y) {
  if (y<=1996) return 'Creation era (1994–96)';
  if (y<=1999) return 'Late Creation (1997–99)';
  if (y<=2005) return 'Big Brother era (2000–05)';
  if (y<=2009) return 'Dig Out era (2006–09)';
  return 'Reissues & uudet (2010–)';
}

function discUrl(item) {
  if (item.status==='missing') return `https://www.discogs.com/master/${item.master_id}`;
  return `https://www.discogs.com/release/${item.id}`;
}

function cardHTML(item) {
  const fc = fmtClass(item.format||item.fmt||'');
  const fl = (item.format||item.fmt||'?').replace('xLP','×LP');
  const imgEl = item.thumb
    ? `<img src="${item.thumb}" loading="lazy" onerror="this.outerHTML='<div class=\\"card-placeholder\\"><svg width=40 height=40 viewBox=\\"0 0 40 40\\"><circle cx=20 cy=20 r=18 stroke=\\"#fff\\" stroke-width=1.5 fill=none/><circle cx=20 cy=20 r=4 fill=\\"#fff\\"/></svg></div>'">`
    : `<div class="card-placeholder"><svg width=40 height=40 viewBox="0 0 40 40"><circle cx=20 cy=20 r=18 stroke="#fff" stroke-width=1.5 fill=none/><circle cx=20 cy=20 r=4 fill="#fff"/></svg></div>`;
  const badge = item.status==='missing'
    ? `<span class="miss-tag">PUUTTUU</span>`
    : (item.special ? `<span class="sp-tag">${item.special}</span>` : '');
  const lbl = (item.label||'').split(',')[0].trim().slice(0,20);
  return `<a class="card ${item.status}" href="${discUrl(item)}" target="_blank" rel="noopener">
    ${imgEl}
    ${badge}
    <span class="fmt-tag ${FTC[fc]||'ft-oth'}">${fl}</span>
    <div class="status-bar"></div>
    <div class="card-info">
      <div class="card-title">${item.title}</div>
      <div class="card-sub">${item.year||''} · ${lbl}</div>
      ${item.catalog?`<div class="card-sub" style="opacity:.55">${item.catalog}</div>`:''}
    </div>
  </a>`;
}

function renderStats() {
  const all = buildAll();
  const own = all.filter(i=>i.status==='owned').length;
  const mis = all.filter(i=>i.status==='missing').length;
  const lps = getOwned().filter(i=>(i.format||'').includes('LP')).length;
  const sp  = getOwned().filter(i=>i.special).length;
  const pct = Math.round(own/(own+mis)*100);
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-item"><div class="n g">${own}</div><div class="l">Omistaa</div></div>
    <div class="stat-item"><div class="n r">${mis}</div><div class="l">Puuttuu</div></div>
    <div class="stat-item"><div class="n a">${pct}%</div><div class="l">Kattavuus</div></div>
    <div class="stat-item"><div class="n" style="color:var(--text)">${lps}</div><div class="l">LP:t</div></div>
    <div class="stat-item"><div class="n" style="color:var(--amber)">${sp}</div><div class="l">Erikoiset</div></div>`;
}

function getFiltered() {
  let items = buildAll();
  const s = (document.getElementById('search').value||'').toLowerCase();
  if (currentTab==='owned')   items=items.filter(i=>i.status==='owned');
  if (currentTab==='missing') items=items.filter(i=>i.status==='missing');
  if (currentTab==='albums')  items=items.filter(i=>(i.format||i.fmt||'').includes('LP'));
  if (currentTab==='singles') items=items.filter(i=>{const f=i.format||i.fmt||'';return f.startsWith('7')||f.startsWith('12')||f.startsWith('10');});
  if (currentTab==='special') items=items.filter(i=>i.special);
  if (s) items=items.filter(i=>(i.title||'').toLowerCase().includes(s)||(i.catalog||'').toLowerCase().includes(s));
  const srt=document.getElementById('sort').value;
  if (srt==='year')   items.sort((a,b)=>(a.year||0)-(b.year||0));
  if (srt==='title')  items.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
  if (srt==='status') items.sort((a,b)=>a.status==='owned'&&b.status==='missing'?-1:1);
  return items;
}

function render() {
  if (!DATA) return;
  const main = document.getElementById('main');
  if (currentTab==='era') {
    let all = buildAll().sort((a,b)=>(a.year||0)-(b.year||0));
    const s = (document.getElementById('search').value||'').toLowerCase();
    if (s) all=all.filter(i=>(i.title||'').toLowerCase().includes(s));
    const groups={};
    all.forEach(i=>{const e=era(i.year);if(!groups[e])groups[e]=[];groups[e].push(i);});
    const order=['Creation era (1994–96)','Late Creation (1997–99)','Big Brother era (2000–05)','Dig Out era (2006–09)','Reissues & uudet (2010–)'];
    main.innerHTML=order.filter(k=>groups[k]).map(k=>{
      const ow=groups[k].filter(i=>i.status==='owned').length;
      const ms=groups[k].filter(i=>i.status==='missing').length;
      return `<div class="section-head">${k}<span class="chip chip-g">${ow} omistaa</span>${ms?`<span class="chip chip-r">${ms} puuttuu</span>`:''}</div><div class="grid">${groups[k].map(cardHTML).join('')}</div>`;
    }).join('');
    return;
  }
  const items=getFiltered();
  main.innerHTML=items.length
    ?`<div class="grid">${items.map(cardHTML).join('')}</div>`
    :`<p style="padding:2rem;color:var(--muted);font-family:monospace">Ei tuloksia.</p>`;
}
