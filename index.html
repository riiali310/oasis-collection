<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oasis — Vinyyli­kokoelma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--bg2:#141416;--bg3:#1c1c1f;--line:rgba(255,255,255,.08);--text:#e8e6e0;--muted:#7a7870;--accent:#c8a96e;--acc2:#4a9eff;--green:#3dba7e;--red:#e05252;--amber:#e8a838;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;}
body{min-height:100vh;}
header{border-bottom:1px solid var(--line);padding:2rem 2rem 1.5rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;letter-spacing:.04em;color:var(--accent);line-height:1;}
.logo span{color:var(--muted);font-size:1rem;font-family:'DM Mono',monospace;display:block;letter-spacing:.12em;margin-bottom:.3rem;}
.header-meta{text-align:right;font-size:.8rem;color:var(--muted);font-family:'DM Mono',monospace;}
.header-meta strong{color:var(--accent);font-size:1.6rem;font-family:'Bebas Neue',sans-serif;display:block;letter-spacing:.05em;}
.stats-bar{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;}
.stat-item{flex:1;min-width:100px;padding:1rem 1.5rem;border-right:1px solid var(--line);font-family:'DM Mono',monospace;}
.stat-item:last-child{border-right:none;}
.stat-item .n{font-size:1.6rem;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;}
.stat-item .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.n.g{color:var(--green)}.n.r{color:var(--red)}.n.a{color:var(--accent)}
.toolbar{padding:1rem 2rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);}
.search-wrap{position:relative;flex:1;min-width:180px;}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.5rem .75rem .5rem 2rem;border-radius:4px;font-family:'DM Mono',monospace;font-size:.8rem;outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap::before{content:'⌕';position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none;}
select{background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.5rem .75rem;border-radius:4px;font-family:'DM Mono',monospace;font-size:.8rem;outline:none;cursor:pointer;}
.tabs{display:flex;gap:.25rem;flex-wrap:wrap;}
.tab{padding:.35rem .9rem;font-size:.75rem;font-family:'DM Mono',monospace;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--muted);background:transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.grid-wrap{padding:1.5rem 2rem;}
.section-head{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.4rem;margin:1.5rem 0 .75rem;display:flex;align-items:center;gap:.75rem;}
.chip{font-family:'DM Mono',monospace;font-size:.65rem;padding:1px 7px;border-radius:2px;}
.chip-g{background:rgba(61,186,126,.15);color:var(--green);}
.chip-r{background:rgba(224,82,82,.15);color:var(--red);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:1px;background:var(--line);}
.card{background:var(--bg2);position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;}
.card.missing{opacity:.6;}
.card-img-wrap{width:100%;aspect-ratio:1/1;overflow:hidden;position:relative;background:var(--bg3);}
.card-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9);}
.card.missing .card-img-wrap img{filter:saturate(0) brightness(.65);}
.card-img-wrap svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;opacity:.2;}
.card-info{padding:.6rem .7rem .7rem;}
.card-title{font-size:.78rem;font-weight:500;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2rem;}
.card.missing .card-title{color:var(--muted);}
.card-sub{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fmt-tag{position:absolute;top:6px;right:6px;font-family:'DM Mono',monospace;font-size:.6rem;font-weight:500;padding:1px 5px;border-radius:2px;letter-spacing:.04em;z-index:2;}
.ft-lp{background:rgba(61,186,126,.85);color:#0c2016;}
.ft-7{background:rgba(74,158,255,.85);color:#02162e;}
.ft-12{background:rgba(200,169,110,.85);color:#2a1e05;}
.ft-oth{background:rgba(122,120,112,.85);color:#1a1a18;}
.sp-tag{position:absolute;top:6px;left:6px;font-family:'DM Mono',monospace;font-size:.58rem;font-weight:500;padding:1px 5px;border-radius:2px;background:rgba(232,168,56,.85);color:#2a1e05;z-index:2;}
.miss-tag{position:absolute;top:6px;left:6px;font-family:'DM Mono',monospace;font-size:.58rem;font-weight:500;padding:1px 5px;border-radius:2px;background:rgba(224,82,82,.85);color:#2a0505;z-index:2;}
.status-bar{position:absolute;bottom:0;left:0;right:0;height:2px;z-index:2;}
.card.owned .status-bar{background:var(--green);}
.card.missing .status-bar{background:var(--red);}
/* Admin hide button */
.hide-btn{display:none;position:absolute;top:6px;left:6px;width:22px;height:22px;background:rgba(224,82,82,.9);border:none;border-radius:3px;cursor:pointer;z-index:10;align-items:center;justify-content:center;font-size:13px;color:#fff;line-height:1;}
.admin-mode .card:hover .hide-btn{display:flex;}
.admin-mode .card:hover .miss-tag,
.admin-mode .card:hover .sp-tag{display:none;}
/* Restore bar */
#restore-bar{display:none;background:rgba(224,82,82,.1);border-bottom:1px solid rgba(224,82,82,.3);padding:.6rem 2rem;align-items:center;gap:1rem;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--red);}
#restore-bar.visible{display:flex;}
#admin-bar{display:none;background:var(--bg3);border-bottom:1px solid var(--accent);padding:.75rem 2rem;align-items:center;gap:1rem;flex-wrap:wrap;}
#admin-bar.visible{display:flex;}
#admin-bar span{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--accent);}
.btn{font-family:'DM Mono',monospace;font-size:.75rem;padding:.4rem .9rem;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:3px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--accent);color:var(--bg);}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:#fff;}
.btn.sm{padding:.25rem .6rem;font-size:.7rem;}
#login-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:100;}
#login-modal.visible{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--line);padding:2rem;width:340px;border-radius:4px;}
.modal-box h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.06em;color:var(--accent);margin-bottom:1rem;}
.modal-box label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);display:block;margin-bottom:.3rem;}
.modal-box input[type=password]{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.5rem .75rem;border-radius:3px;font-family:'DM Mono',monospace;font-size:.85rem;outline:none;margin-bottom:1rem;}
.modal-box input:focus{border-color:var(--accent);}
.modal-row{display:flex;gap:.5rem;justify-content:flex-end;}
.modal-err{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--red);margin-bottom:.5rem;display:none;}
footer{border-top:1px solid var(--line);padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;}
footer p{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);}
footer a{color:var(--accent);text-decoration:none;}
#login-btn{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);background:none;border:none;cursor:pointer;}
#login-btn:hover{color:var(--accent);}
.loading{padding:3rem 2rem;text-align:center;font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);}
@media(max-width:600px){header,.toolbar,.grid-wrap,footer{padding-left:1rem;padding-right:1rem;}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}}
</style>
</head>
<body>
<header>
  <div class="logo"><span>VINYL COLLECTION</span>Oasis</div>
  <div class="header-meta"><strong id="total-count">—</strong>levyä kokoelmassa</div>
</header>
<div class="stats-bar" id="stats-bar"></div>
<div id="admin-bar">
  <span>⚡ Muokkaustila — klikkaa X piilottaaksesi kortin</span>
  <button class="btn sm" onclick="showHidden()">Näytä piilotetut (<span id="hidden-count">0</span>)</button>
  <button class="btn sm danger" onclick="adminLogout()">Kirjaudu ulos</button>
</div>
<div id="restore-bar">
  <span id="restore-info"></span>
  <button class="btn sm" onclick="restoreAll()">Palauta kaikki</button>
  <button class="btn sm" onclick="hideRestoreBar()">Sulje</button>
</div>
<div class="toolbar">
  <div class="search-wrap"><input id="search" type="text" placeholder="Hae levyä..." autocomplete="off"></div>
  <select id="sort">
    <option value="year">Vuosi</option>
    <option value="title">Nimi A–Z</option>
    <option value="status">Omistaa ensin</option>
  </select>
  <div class="tabs">
    <button class="tab active" data-tab="all">Kaikki</button>
    <button class="tab" data-tab="owned">Omistaa</button>
    <button class="tab" data-tab="missing">Puuttuu</button>
    <button class="tab" data-tab="albums">Albumit</button>
    <button class="tab" data-tab="singles">Sinkut</button>
    <button class="tab" data-tab="special">Erikoiset ★</button>
    <button class="tab" data-tab="era">Aikakausi</button>
  </div>
</div>
<main class="grid-wrap" id="main"><div class="loading">Ladataan...</div></main>
<footer>
  <p>Päivitetty: <span id="updated">—</span> &nbsp;·&nbsp; <a href="https://www.discogs.com/user/freeal/collection" target="_blank">Discogs ↗</a></p>
  <button id="login-btn" onclick="showLogin()">⚙</button>
</footer>
<div id="login-modal">
  <div class="modal-box">
    <h2>Kirjaudu sisään</h2>
    <label>Salasana</label>
    <input type="password" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <p class="modal-err" id="login-err">Väärä salasana</p>
    <div class="modal-row">
      <button class="btn" style="border-color:var(--muted);color:var(--muted)" onclick="hideLogin()">Peruuta</button>
      <button class="btn" onclick="doLogin()">Kirjaudu</button>
    </div>
  </div>
</div>
<script>
const PASS_HASH='a47f54bef75b9dc8a00cd67cc3fb77e756b0c1a5c95f2048a5a9b0e14c5c2e7b';
const LS_KEY='oasis_hidden_v1';
let COL=null,DISC=null,TAB='all',isAdmin=false;

async function sha256(m){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}

function getHidden(){try{return new Set(JSON.parse(localStorage.getItem(LS_KEY)||'[]'));}catch{return new Set();}}
function saveHidden(s){localStorage.setItem(LS_KEY,JSON.stringify([...s]));}
function hideItem(mid){const h=getHidden();h.add(String(mid));saveHidden(h);updateHiddenCount();render();}
function restoreAll(){saveHidden(new Set());updateHiddenCount();hideRestoreBar();render();}
function updateHiddenCount(){
  const n=getHidden().size;
  document.getElementById('hidden-count').textContent=n;
}
function showHidden(){
  const h=getHidden();
  if(h.size===0){alert('Ei piilotettuja julkaisuja.');return;}
  const hidden=buildAll().filter(i=>h.has(String(i.master_id||i.mid)));
  document.getElementById('restore-info').textContent=`Piilotettu ${h.size} julkaisua: `+hidden.slice(0,3).map(i=>i.title).join(', ')+(hidden.length>3?'...':'');
  document.getElementById('restore-bar').classList.add('visible');
}
function hideRestoreBar(){document.getElementById('restore-bar').classList.remove('visible');}

async function load(){
  try{
    const [cr,dr]=await Promise.all([
      fetch('data/collection.json?v='+Date.now()).then(r=>r.json()),
      fetch('data/discography.json?v='+Date.now()).then(r=>r.json())
    ]);
    COL=cr;DISC=dr;
    document.getElementById('total-count').textContent=COL.meta.total;
    document.getElementById('updated').textContent=COL.meta.updated;
    updateHiddenCount();
    stats();render();
  }catch(e){
    document.getElementById('main').innerHTML='<p class="loading">Virhe ladattaessa dataa.</p>';
  }
}

function owned(){return COL?COL.owned:[];}
function discography(){return DISC?DISC.releases:[];}

function buildAll(){
  const hidden=getHidden();
  const om=new Set(owned().map(o=>o.master_id));
  const missing=discography()
    .filter(d=>!om.has(d.mid)&&!hidden.has(String(d.mid)))
    .map(d=>({id:d.mid,master_id:d.mid,title:d.title,year:d.year,format:d.fmt,label:d.label,thumb:d.thumb,catalog:'',status:'missing'}));
  return[
    ...owned().filter(o=>!hidden.has(String(o.master_id))).map(o=>({...o,status:'owned'})),
    ...missing
  ];
}

function fc(f){if(!f)return'oth';if(f.includes('LP')||f.includes('xLP'))return'lp';if(f.startsWith('7'))return's7';if(f.startsWith('12'))return's12';return'oth';}
const FT={lp:'ft-lp',s7:'ft-7',s12:'ft-12',oth:'ft-oth'};
function era(y){if(y<=1996)return'Creation era (1994–96)';if(y<=1999)return'Late Creation (1997–99)';if(y<=2005)return'Big Brother era (2000–05)';if(y<=2009)return'Dig Out era (2006–09)';return'Reissues & uudet (2010–)';}
function durl(i){return i.status==='missing'?`https://www.discogs.com/master/${i.master_id}`:`https://www.discogs.com/release/${i.id}`;}

function card(i){
  const c=fc(i.format||'');
  const fl=(i.format||'?').replace('xLP','×LP');
  const svg=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="#fff" stroke-width="1.5" fill="none"/><circle cx="20" cy="20" r="4" fill="#fff"/></svg>`;
  const img=i.thumb?`<img src="${i.thumb}" loading="lazy" onerror="this.style.display='none'">`:'';
  const badge=i.status==='missing'?`<span class="miss-tag">PUUTTUU</span>`:(i.special?`<span class="sp-tag">${i.special}</span>`:'');
  const lbl=(i.label||'').split(',')[0].trim().slice(0,20);
  const mid=i.master_id||i.mid||i.id;
  const hideBtn=`<button class="hide-btn" onclick="event.preventDefault();event.stopPropagation();hideItem(${mid})" title="Piilota">✕</button>`;
  return `<a class="card ${i.status}" href="${durl(i)}" target="_blank" rel="noopener">
    <div class="card-img-wrap">${svg}${img}</div>
    ${badge}${hideBtn}
    <span class="fmt-tag ${FT[c]||'ft-oth'}">${fl}</span>
    <div class="status-bar"></div>
    <div class="card-info">
      <div class="card-title">${i.title}</div>
      <div class="card-sub">${i.year||''} · ${lbl}</div>
      ${i.catalog?`<div class="card-sub" style="opacity:.5">${i.catalog}</div>`:''}
    </div></a>`;}

function stats(){
  if(!COL||!DISC)return;
  const a=buildAll();
  const ow=a.filter(i=>i.status==='owned').length;
  const ms=a.filter(i=>i.status==='missing').length;
  const lp=owned().filter(i=>(i.format||'').includes('LP')).length;
  const sp=owned().filter(i=>i.special).length;
  const p=Math.round(ow/(ow+ms)*100);
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-item"><div class="n g">${ow}</div><div class="l">Omistaa</div></div>
    <div class="stat-item"><div class="n r">${ms}</div><div class="l">Puuttuu</div></div>
    <div class="stat-item"><div class="n a">${p}%</div><div class="l">Kattavuus</div></div>
    <div class="stat-item"><div class="n" style="color:var(--text)">${lp}</div><div class="l">LP:t</div></div>
    <div class="stat-item"><div class="n" style="color:var(--amber)">${sp}</div><div class="l">Erikoiset</div></div>`;}

function filtered(){
  let it=buildAll();
  const s=(document.getElementById('search').value||'').toLowerCase();
  if(TAB==='owned')  it=it.filter(i=>i.status==='owned');
  if(TAB==='missing')it=it.filter(i=>i.status==='missing');
  if(TAB==='albums') it=it.filter(i=>(i.format||'').includes('LP'));
  if(TAB==='singles')it=it.filter(i=>{const f=i.format||'';return f.startsWith('7')||f.startsWith('12')||f.startsWith('10');});
  if(TAB==='special')it=it.filter(i=>i.special);
  if(s)it=it.filter(i=>(i.title||'').toLowerCase().includes(s)||(i.catalog||'').toLowerCase().includes(s));
  const sr=document.getElementById('sort').value;
  if(sr==='year') it.sort((a,b)=>(a.year||0)-(b.year||0));
  if(sr==='title')it.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
  if(sr==='status')it.sort((a,b)=>a.status==='owned'&&b.status==='missing'?-1:1);
  return it;
}

function render(){
  if(!COL||!DISC)return;
  stats();
  const m=document.getElementById('main');
  if(TAB==='era'){
    let a=buildAll().sort((x,y)=>(x.year||0)-(y.year||0));
    const s=(document.getElementById('search').value||'').toLowerCase();
    if(s)a=a.filter(i=>(i.title||'').toLowerCase().includes(s));
    const g={};
    a.forEach(i=>{const e=era(i.year);if(!g[e])g[e]=[];g[e].push(i);});
    const o=['Creation era (1994–96)','Late Creation (1997–99)','Big Brother era (2000–05)','Dig Out era (2006–09)','Reissues & uudet (2010–)'];
    m.innerHTML=o.filter(k=>g[k]).map(k=>{
      const ow=g[k].filter(i=>i.status==='owned').length;
      const ms=g[k].filter(i=>i.status==='missing').length;
      return`<div class="section-head">${k}<span class="chip chip-g">${ow} omistaa</span>${ms?`<span class="chip chip-r">${ms} puuttuu</span>`:''}</div><div class="grid">${g[k].map(card).join('')}</div>`;
    }).join('');
    return;
  }
  const it=filtered();
  m.innerHTML=it.length?`<div class="grid">${it.map(card).join('')}</div>`:`<p class="loading">Ei tuloksia.</p>`;}

function showLogin(){document.getElementById('login-modal').classList.add('visible');document.getElementById('pwd-input').focus();}
function hideLogin(){document.getElementById('login-modal').classList.remove('visible');document.getElementById('login-err').style.display='none';}
async function doLogin(){
  const h=await sha256(document.getElementById('pwd-input').value);
  if(h===PASS_HASH){
    isAdmin=true;sessionStorage.setItem('admin','1');
    document.getElementById('admin-bar').classList.add('visible');
    document.body.classList.add('admin-mode');
    hideLogin();document.getElementById('pwd-input').value='';
  }else{document.getElementById('login-err').style.display='block';}}
function adminLogout(){
  isAdmin=false;sessionStorage.removeItem('admin');
  document.getElementById('admin-bar').classList.remove('visible');
  document.body.classList.remove('admin-mode');}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');TAB=t.dataset.tab;render();
}));
document.getElementById('search').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
if(sessionStorage.getItem('admin')){
  isAdmin=true;
  document.getElementById('admin-bar').classList.add('visible');
  document.body.classList.add('admin-mode');
}
load();
</script>
</body>
</html>
